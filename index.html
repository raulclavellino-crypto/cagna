<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cagna Junín - Gestión</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f1e8;
      --paper: #fffdf8;
      --paper-soft: #f2eadc;
      --ink: #2b2924;
      --muted: #776e61;
      --line: #e1d5c4;
      --green: #203d2c;
      --green-2: #315943;
      --green-soft: #e5efe7;
      --gold: #c19a3a;
      --gold-2: #a77d23;
      --gold-soft: #f4e7c4;
      --clay: #7b4f31;
      --danger: #b8423b;
      --danger-soft: #fae8e4;
      --shadow: 0 10px 26px rgba(47, 39, 27, .07);
      --shadow-soft: 0 4px 14px rgba(47, 39, 27, .055);
      --radius: 18px;
      --radius-sm: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(193,154,58,.14), transparent 34rem),
        linear-gradient(135deg, #faf5ec 0%, var(--bg) 48%, #efe5d4 100%);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }
    .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 16px;
      background: linear-gradient(180deg, #1d3828 0%, #152f21 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 1px solid rgba(255,255,255,.06);
      overflow: auto;
    }
    .brand {
      border-radius: 24px;
      padding: 18px 16px;
      text-align: center;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(193,154,58,.16);
    }
    .brand-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 10px;
      border-radius: 21px;
      padding: 8px;
      background: #fffdf8;
      border: 1px solid rgba(193,154,58,.33);
      box-shadow: 0 14px 34px rgba(0,0,0,.16);
    }
    .brand-logo img, .avatar img { width: 100%; height: 100%; object-fit: contain; }
    .brand h1, .title, .section-title, .card h2, .card h3, .logo-word { font-family: Georgia, "Times New Roman", serif; }
    .brand h1 { margin: 0 0 5px; color: #f9eed9; font-size: 29px; line-height: 1; font-weight: 500; }
    .brand p { margin: 0; color: #d6c08a; text-transform: uppercase; letter-spacing: .9px; font-size: 9px; }
    .menu { display: flex; flex-direction: column; gap: 5px; }
    .menu button {
      border: 0;
      width: 100%;
      min-height: 39px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 12px;
      padding: 9px 12px;
      background: transparent;
      color: #eee7da;
      font-weight: 620;
      font-size: 14px;
      text-align: left;
      transition: .18s ease;
    }
    .menu svg { color: #d6bd73; width: 18px; height: 18px; flex: 0 0 auto; }
    .menu button:hover, .menu button.active {
      background: linear-gradient(90deg, rgba(69,111,79,.95), rgba(92,137,91,.72));
      color: #fff;
      transform: translateX(2px);
    }
    .sidebar-note {
      margin-top: auto;
      padding: 13px;
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(193,154,58,.2);
      color: #f2eadc;
    }
    .sidebar-note strong { display: block; margin-bottom: 7px; }
    .sidebar-note span { color: #d8cfbf; font-size: 12px; line-height: 1.4; }
    .main { padding: 24px 26px 30px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
    .topbar { display: flex; gap: 16px; align-items: center; }
    .search {
      flex: 1;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 16px;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: rgba(255,253,248,.86);
      box-shadow: var(--shadow-soft);
      color: var(--muted);
    }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); }
    .top-button, .profile {
      height: 54px;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: rgba(255,253,248,.9);
      box-shadow: var(--shadow-soft);
    }
    .top-button {
      width: 54px;
      display: grid;
      place-items: center;
      color: var(--green);
      position: relative;
    }
    .cloud-pill {
      min-height: 42px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,253,248,.78);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
    }
    .cloud-dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(193,154,58,.12);
    }
    .cloud-pill.synced { color: var(--green); }
    .cloud-pill.synced .cloud-dot { background: #2d8b58; box-shadow: 0 0 0 4px rgba(45,139,88,.12); }
    .cloud-pill.offline .cloud-dot { background: var(--muted); box-shadow: 0 0 0 4px rgba(119,110,97,.12); }
    .badge {
      position: absolute;
      top: -6px;
      right: -5px;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--gold);
      color: #fff;
      font-size: 12px;
      font-weight: 750;
    }
    .profile { display: flex; align-items: center; gap: 12px; padding: 8px 14px; white-space: nowrap; }
    .cloud-box {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 16px;
      background: rgba(246,241,232,.55);
    }
    .cloud-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .stack-actions { display: grid; gap: 10px; }
    .stack-actions .btn { width: 100%; justify-content: center; }
    .login-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 20% 20%, rgba(193,154,58,.22), transparent 28rem),
        linear-gradient(135deg, #173424 0%, #102417 100%);
    }
    .login-gate.show { display: grid; }
    .login-panel {
      width: min(440px, 100%);
      padding: 28px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: var(--paper);
      box-shadow: 0 30px 90px rgba(0,0,0,.34);
    }
    .login-panel .brand-logo { margin-bottom: 16px; }
    .login-panel h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      color: var(--green);
      font-weight: 500;
    }
    .login-panel p { margin: 10px 0 22px; color: var(--muted); line-height: 1.45; }
    .login-panel .btn { width: 100%; justify-content: center; margin-top: 4px; }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 5px;
      background: #fffdf8;
      border: 1px solid var(--line);
      overflow: hidden;
      flex: 0 0 auto;
    }
    .profile small { display: block; color: var(--muted); font-size: 12px; }
    .crumb { color: var(--muted); font-size: 13px; font-weight: 600; min-height: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; }
    .grid-2 { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(360px,.72fr); gap: 28px; align-items: start; }
    .grid-2.equal { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .card, .kpi, .product-card, .client-card {
      background: rgba(255,253,248,.92);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card { padding: 22px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    .products-head {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(340px, 520px) auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 22px;
    }
    .products-title-block h2 { margin: 0; font-size: 25px; font-weight: 540; }
    .products-title-block .subtitle { margin-top: 14px; max-width: 620px; }
    .products-search {
      width: 100%;
      align-self: center;
      justify-self: center;
    }
    .products-head .btn { white-space: nowrap; }
    .card h2, .card h3 { margin: 0; font-size: 22px; font-weight: 540; }
    .title { margin: 0; font-size: 29px; color: var(--green); font-weight: 540; }
    .subtitle { margin: 6px 0 0; color: var(--muted); line-height: 1.45; }
    .kpi { padding: 18px; min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; }
    .kpi-top { display: flex; gap: 12px; align-items: center; }
    .kpi-icon {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--green-2));
    }
    .kpi-icon.gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); }
    .kpi-label { color: var(--muted); font-size: 12px; font-weight: 620; }
    .kpi-value { font-size: clamp(22px, 2vw, 28px); font-weight: 720; line-height: 1; margin-top: 4px; }
    .kpi-note { color: var(--green-2); font-size: 12px; font-weight: 650; }
    .quick-actions { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 14px; }
    .quick {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: linear-gradient(180deg, #fffdf8, var(--paper-soft));
      color: var(--green);
      padding: 12px 10px;
      font-weight: 620;
      font-size: 13px;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
    }
    .quick svg { width: 25px; height: 25px; stroke-width: 1.7; }
    .btn, .chip, .icon-btn {
      border-radius: 13px;
      border: 1px solid transparent;
      min-height: 42px;
      padding: 10px 14px;
      font-weight: 650;
      transition: .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn { background: var(--green); color: white; }
    .btn.gold { background: var(--gold); color: white; }
    .btn.outline { background: transparent; color: var(--green); border-color: var(--green); }
    .btn.soft { background: var(--green-soft); color: var(--green); border-color: #cfdece; }
    .btn.danger { background: var(--danger-soft); color: var(--danger); border-color: #f0cac3; }
    .btn.full { width: 100%; }
    .btn:disabled { opacity: .52; cursor: not-allowed; transform: none; }
    .quick:hover, .btn:hover, .chip:hover, .product-card:hover, .client-card:hover, .top-button:hover {
      transform: translateY(-2px);
      filter: brightness(.985);
    }
    .toolbar, .filters, .inline-list { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .filters { margin-bottom: 16px; }
    .chip {
      background: var(--paper-soft);
      color: var(--ink);
      border-color: var(--line);
      min-height: 38px;
      padding: 9px 13px;
    }
    .chip.active { background: var(--green); color: white; border-color: var(--green); }
    .input, .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 13px;
      padding: 12px 13px;
      color: var(--ink);
      outline: 0;
    }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field span { color: var(--muted); font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .25px; }
    .field textarea { min-height: 92px; resize: vertical; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
    .full { grid-column: 1 / -1; }
    .products-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
    .product-card { overflow: hidden; background: white; transition: .18s ease; cursor: pointer; }
    .product-card.off { opacity: .62; }
    .product-image {
      height: 112px;
      padding: 12px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: linear-gradient(135deg, #203d2c, #c19a3a);
      color: white;
      font-size: 12px;
      font-weight: 650;
    }
    .product-image.Mates { background: linear-gradient(135deg, #6d4728, #a9753b); }
    .product-image.Materas { background: linear-gradient(135deg, #20201e, #776153); }
    .product-image.Bombillas { background: linear-gradient(135deg, #8d6b37, #d8bd7a); }
    .product-image.Termos { background: linear-gradient(135deg, #6d7470, #d4d4ce); color: #172019; }
    .product-image.Accesorios { background: linear-gradient(135deg, #365844, #c6a74b); }
    .product-image img {
      width: 100%;
      height: 100%;
      margin: 0;
      object-fit: contain;
      object-position: center;
      display: block;
      border-radius: 12px;
      background: #fffdf8;
    }
    .product-body { padding: 12px; display: flex; flex-direction: column; gap: 7px; }
    .tag, .status {
      width: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 650;
      display: inline-flex;
    }
    .tag { background: var(--gold-soft); color: #745417; }
    .status { background: var(--green-soft); color: var(--green); }
    .status.off { background: #eee8df; color: var(--muted); }
    .product-title { font-size: 15px; font-weight: 680; line-height: 1.25; min-height: 34px; }
    .desc, .muted { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .desc { min-height: 0; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price { font-size: 20px; font-weight: 720; color: var(--green); }
    .split { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    .upload {
      min-height: 116px;
      border: 2px dashed var(--line);
      background: linear-gradient(180deg, #f7efe3, #f1e6d7);
      border-radius: 16px;
      color: var(--muted);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .upload > div { display: grid; gap: 6px; justify-items: center; }
    .upload svg { width: 24px; height: 24px; color: var(--green); opacity: .72; }
    .upload strong { font-size: 16px; color: var(--ink); font-weight: 650; }
    .upload p { margin: 0; font-size: 13px; }
    .upload input { display: none; }
    .upload img { width: 100%; max-height: 170px; object-fit: contain; object-position:center; background:#fffdf8; border-radius: 14px; }
    .save-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .metric-row, .list-row, .select-row, .order-row, .sale-line, .help-row {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 10px;
    }
    .metric-row { display: grid; grid-template-columns: auto 1fr; gap: 11px; align-items: center; }
    .list-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .list-row strong, .metric-row strong { display: block; }
    .list-row span, .metric-row span { color: var(--muted); font-size: 13px; }
    .stock-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .big-number { font-size: 36px; color: var(--green); font-weight: 720; line-height: 1; }
    .sale-lines { display: flex; flex-direction: column; gap: 10px; }
    .sale-line { display: grid; grid-template-columns: minmax(0,1fr) 140px 46px; gap: 10px; align-items: end; margin-bottom: 0; }
    .total-bar {
      margin: 15px 0;
      border-radius: 17px;
      padding: 16px;
      background: var(--green-soft);
      border: 1px solid #cbdccf;
      color: var(--green);
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 720;
    }
    .order-row { display: grid; grid-template-columns: minmax(0,1fr) 190px auto; gap: 12px; align-items: center; }
    .order-row select { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #fff; }
    .client-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 15px; }
    .client-card { padding: 17px; transition: .18s ease; }
    .client-card h3 { margin: 11px 0 4px; }
    .select-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 12px; }
    .catalog-preview {
      border-radius: 22px;
      padding: 20px;
      background: linear-gradient(180deg, #fffdf8, #f3eadb);
      border: 1px solid var(--line);
    }
    .logo-word { color: var(--green); font-size: 35px; margin-bottom: 5px; }
    .report-controls { display: grid; grid-template-columns: 160px 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .bar-list { display: flex; flex-direction: column; gap: 11px; }
    .bar { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: center; }
    .bar-track { height: 12px; border-radius: 999px; background: var(--paper-soft); overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--gold)); border-radius: 999px; }
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      padding: 13px 15px;
      border-radius: 14px;
      background: var(--green);
      color: white;
      box-shadow: var(--shadow);
      font-weight: 650;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .2s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,.52);
    }
    .help-row { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 12px; align-items: start; }
    .help-row h3 { margin: 0 0 4px; font-family: inherit; font-size: 16px; }
    .help-row p { margin: 0; color: var(--muted); line-height: 1.45; }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 650;
      background: var(--gold-soft);
      color: #765615;
    }
    #app { animation: pageIn .24s ease both; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .notifications-panel {
      position: fixed;
      top: 86px;
      right: 178px;
      width: 360px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,253,248,.98);
      box-shadow: 0 20px 50px rgba(47, 39, 27, .16);
      z-index: 30;
      opacity: 0;
      transform: translateY(-6px) scale(.98);
      pointer-events: none;
      transition: .2s ease;
    }
    .notifications-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .notification-item {
      width: 100%;
      display: grid;
      grid-template-columns: 34px minmax(0,1fr);
      gap: 10px;
      align-items: start;
      border-radius: 14px;
      padding: 11px;
      background: #fff;
      border: 1px solid var(--line);
      margin-top: 9px;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
    }
    .notifications-panel > .split { align-items: center; }
    .notifications-panel > .split strong { font-size: 18px; font-weight: 620; }
    .notifications-panel .btn { min-height: 36px; padding: 8px 12px; }
    .notification-item strong { display: block; font-weight: 650; }
    .notification-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    @media (max-width: 1450px) {
      .grid-2, .grid-2.equal { grid-template-columns: 1fr; }
      .products-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .report-controls { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .products-head { grid-template-columns: 1fr; }
      .products-search { justify-self: stretch; max-width: none; }
    }
    @media (max-width: 1120px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .quick-actions { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .stock-grid, .client-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .main { padding: 14px; }
      .topbar { flex-wrap: wrap; }
      .search { order: 3; flex-basis: 100%; }
      .grid-4, .quick-actions, .products-grid, .form-grid, .report-controls { grid-template-columns: 1fr; }
      .profile small, .profile strong { display: none; }

    function paymentLabel(kind) { return paymentKinds.find(item => item.value === kind)?.label || "Efectivo / transferencia"; }
    function paymentMultiplier(kind) { return kind === "tarjeta" ? 1.15 : 1; }
    function priceForPayment(price, kind) { return Math.round(Number(price || 0) * paymentMultiplier(kind)); }
    function promoOptions(kind) { return kind === "tarjeta" ? cardPromos : cashPromos; }
    function promoSelectOptions(kind, selected) {
      const options = promoOptions(kind);
      const current = options.includes(selected) ? selected : options[0];
      return options.map(option => `<option ${current === option ? "selected" : ""}>${safe(option)}</option>`).join("");
    }
    function todayISO() { return new Date().toISOString().slice(0, 10); }
    function shiftISO(days) { const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
    function dateLabel(iso) { return new Intl.DateTimeFormat("es-AR", { day:"2-digit", month:"short", year:"numeric" }).format(new Date(iso + "T12:00:00")); }
    function weekValue(date) {
      const target = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const day = target.getUTCDay() || 7;
      target.setUTCDate(target.getUTCDate() + 4 - day);
      const yearStart = new Date(Date.UTC(target.getUTCFullYear(), 0, 1));
      const week = Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
      return target.getUTCFullYear() + "-W" + String(week).padStart(2, "0");
    }
    function isInWeek(iso, week) { return weekValue(new Date(iso + "T12:00:00")) === week; }
    function safe(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    }
    function val(id) { return document.getElementById(id)?.value || ""; }
    function checked(id) { return Boolean(document.getElementById(id)?.checked); }
    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1900);
    }

    function stats() {
      const stock = state.products.reduce((sum, p) => sum + Number(p.stock), 0);
      const inventory = state.products.reduce((sum, p) => sum + Number(p.stock) * Number(p.cost), 0);
      const salesToday = state.sales.filter(s => s.dateISO === todayISO()).reduce((sum, s) => sum + s.total, 0);
      const pending = state.orders.filter(o => !["Entregado", "Cancelado"].includes(o.status)).length;
      return { stock, inventory, salesToday, pending };
    }

    function renderNotifications() {
      const panel = document.getElementById("notificationsPanel");
      if (!panel) return;
      const lowStock = state.products.filter(p => p.stock <= 7);
      const pendingOrders = state.orders.filter(o => ["Nuevo", "Pendiente de pago"].includes(o.status));
      const items = [
        ...lowStock.map(p => ({
          id: `stock-${p.id}`,
          icon: icons.bell,
          title: p.name,
          text: `Stock bajo: quedan ${p.stock} ${p.unit}.`,
          action: `focusProduct('${p.id}')`
        })),
        ...pendingOrders.slice(0, 3).map(o => ({
          id: `order-${o.id}`,
          icon: icons.order,
          title: o.client,
          text: `Pedido ${o.status.toLowerCase()} por ${money(o.total)}.`,
          action: "go('pedidos')"
        }))
      ].filter(item => !(state.dismissedNotifications || []).includes(item.id));
      panel.className = `notifications-panel ${notificationsOpen ? "open" : ""}`;
      panel.innerHTML = `<div class="split"><strong>Notificaciones</strong><div class="row"><button class="btn outline" onclick="dismissAllNotifications()">Limpiar</button><button class="btn outline" onclick="notificationsOpen=false;renderNotifications()">Cerrar</button></div></div>` +
        (items.length ? items.map(item => `<div class="notification-item">${item.icon}<span><strong>${safe(item.title)}</strong><span>${safe(item.text)}</span><span class="row" style="margin-top:8px"><button class="btn soft" onclick="${item.action};notificationsOpen=false;renderNotifications()">Ver</button><button class="btn outline" onclick="dismissNotification('${item.id}')">Borrar</button></span></span></div>`).join("") : `<div class="empty" style="margin-top:10px">No hay alertas pendientes.</div>`);
    }

    function visibleNotificationCount() {
      const dismissed = state.dismissedNotifications || [];
      const lowStock = state.products.filter(p => p.stock <= 7).map(p => `stock-${p.id}`);
      const pendingOrders = state.orders.filter(o => ["Nuevo", "Pendiente de pago"].includes(o.status)).map(o => `order-${o.id}`);
      return [...lowStock, ...pendingOrders].filter(id => !dismissed.includes(id)).length;
    }

      state.dismissedNotifications = [...new Set([...(state.dismissedNotifications || []), id])];

      renderChrome();

    function dismissAllNotifications() {
      const lowStock = state.products.filter(p => p.stock <= 7).map(p => `stock-${p.id}`);

    function field(label, control, full = false) {
      return `<label class="field ${full ? "full" : ""}"><span>${label}</span>${control}</label>`;

    function loadProductImage(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const imageData = reader.result;
        if (editingProductId) {
          const product = state.products.find(p => p.id === editingProductId);
          if (product) product.image = imageData;
          saveState();
        } else {
          productImageDraft = imageData;
        }
        render();
      };
      reader.readAsDataURL(file);
    }
    function editProduct(id) { editingProductId = id; productImageDraft = ""; render(); }
    function cancelProductEdit() { editingProductId = ""; productImageDraft = ""; render(); }
    function saveProduct() {
      const name = val("prod-name").trim();
      if (!name) return toast("Falta el nombre del producto");
      const data = {
        name,
        category: val("prod-category"),
        cost: Number(val("prod-cost")),
        price: Number(val("prod-price")),
        stock: Number(val("prod-stock")),
        unit: val("prod-unit"),
        description: val("prod-description"),
        active: val("prod-active") === "true"
      };
      if (editingProductId) {
        const product = state.products.find(p => p.id === editingProductId);
        Object.assign(product, data);
        toast("Producto actualizado");
      } else {
        state.products.unshift({ id: uid("prod"), ...data, image: productImageDraft });
        productImageDraft = "";
        toast("Producto agregado");
      }
      editingProductId = "";
      saveState();
      if (currentModal) closeModal();
      render();
    }

      const product = state.products.find(p => p.id === id);

      state.products = state.products.filter(p => p.id !== id);
      catalogSelected = catalogSelected.filter(pid => pid !== id);
      saveState();
      toast("Producto eliminado");
      render();
    }

    function stockForm(defaultType = "Ingreso de stock") {

        <div class="form-grid">
          ${field("Producto", `<select id="stock-product">${state.products.map(p => `<option value="${p.id}">${safe(p.name)} · Stock ${p.stock}</option>`).join("")}</select>`, true)}

          ${field("Cantidad", `<input id="stock-qty" type="number" value="1">`)}
          ${field("Observación", `<input id="stock-note" placeholder="Reposición, control, rotura...">`, true)}

        <div class="save-row"><button class="btn" onclick="saveStockMovement()">${icons.stock}Registrar movimiento</button></div>`;

    function saveStockMovement() {
      const product = state.products.find(p => p.id === val("stock-product"));
      const qty = Number(val("stock-qty"));
      const type = val("stock-type");
      if (!product || !qty) return toast("Revisá producto y cantidad");
      const delta = type === "Ingreso de stock" ? Math.abs(qty) : type === "Salida por venta" ? -Math.abs(qty) : qty;
      product.stock = Math.max(0, Number(product.stock) + delta);
      state.movements.unshift({ id: uid("mov"), dateISO: todayISO(), productId: product.id, productName: product.name, type, quantity: delta, note: val("stock-note") });
      saveState();
      if (currentModal) closeModal();
      toast("Stock actualizado");
      render();
    }

          ${field("Fecha", `<input id="sale-date" type="date" value="${todayISO()}">`, true)}
        </div>

    function salesPage() {
      return `<section class="grid-2">
        <div class="card">
          <div class="card-head"><div><h2>Registrar venta</h2><p class="subtitle">Agregá uno o varios productos. El stock se descuenta solo.</p></div></div>
          ${saleFormContent()}
        </div>
        <div class="card">
          <div class="card-head"><h2>Historial de ventas</h2><button class="btn soft" onclick="go('reportes')">${icons.report}Ver reportes</button></div>
          ${state.sales.length ? state.sales.slice(0, 12).map(saleRow).join("") : `<div class="empty">Todavía no hay ventas.</div>`}
        </div>
      </section>`;
    }
    function renderSaleLines() {
      const root = document.getElementById("saleLines");
      if (!root) return;
      root.innerHTML = saleLines.map((line, index) => `
        <div class="sale-line">
          ${field("Producto", `<select onchange="saleLines[${index}].productId=this.value;updateSaleTotal()">${state.products.filter(p => p.active).map(p => `<option value="${p.id}" ${line.productId === p.id ? "selected" : ""}>${safe(p.name)} · Stock ${p.stock}</option>`).join("")}</select>`)}
          ${field("Cantidad", `<input type="number" min="1" value="${line.quantity}" oninput="saleLines[${index}].quantity=this.value;updateSaleTotal()">`)}
          ${saleLines.length > 1 ? `<button class="btn danger" onclick="removeSaleLine(${index})">${icons.trash}</button>` : `<span></span>`}
        </div>`).join("");
      updateSaleTotal();
    }
    function addSaleLine() { saleLines.push({ productId: state.products.find(p => p.active)?.id || state.products[0]?.id || "", quantity: 1 }); renderSaleLines(); }
    function removeSaleLine(index) { saleLines.splice(index, 1); renderSaleLines(); }
    function updateSaleTotal() {
      const paymentKind = val("sale-payment-kind") || "efectivo";
      const total = saleLines.reduce((sum, line) => {
        const product = state.products.find(p => p.id === line.productId);
        return sum + (product ? priceForPayment(product.price, paymentKind) * Number(line.quantity || 0) : 0);
      }, 0);
      const el = document.getElementById("saleTotal");
      if (el) el.textContent = money(total);
    }
    function updateSalePaymentOptions() {
      const kind = val("sale-payment-kind") || "efectivo";
      const promo = document.getElementById("sale-promo");
      if (promo) promo.innerHTML = promoSelectOptions(kind, promo.value);
    }
    function saveSale() {
      const items = saleLines.map(line => ({ product: state.products.find(p => p.id === line.productId), quantity: Number(line.quantity) }));
      const totalsByProduct = {};
      for (const item of items) {
        if (!item.product || item.quantity <= 0) return toast("Revisá los productos de la venta");
        totalsByProduct[item.product.id] = (totalsByProduct[item.product.id] || 0) + item.quantity;
      }
      for (const [pid, qty] of Object.entries(totalsByProduct)) {
        const product = state.products.find(p => p.id === pid);
        if (!product || product.stock < qty) return toast("No hay stock suficiente");
      }
      const saleItems = items.map(({ product, quantity }) => ({ productId: product.id, name: product.name, quantity, price: product.price }));
      const paymentKind = val("sale-payment-kind") || "efectivo";
      const promo = val("sale-promo");
      const pricedItems = items.map(({ product, quantity }) => ({ productId: product.id, name: product.name, quantity, price: priceForPayment(product.price, paymentKind) }));
      const sale = {
        id: uid("sale"),
        dateISO: val("sale-date") || todayISO(),
        client: val("sale-client") || "Sin cliente",
        method: `${paymentLabel(paymentKind)}${promo ? " · " + promo : ""}`,
        paymentKind,
        promo,
        items: pricedItems,
        total: pricedItems.reduce((sum, item) => sum + item.quantity * item.price, 0)
      };
      for (const item of saleItems) {
        const product = state.products.find(p => p.id === item.productId);
        product.stock -= item.quantity;
        state.movements.unshift({ id: uid("mov"), dateISO: sale.dateISO, productId: product.id, productName: product.name, type:"Salida por venta", quantity:-item.quantity, note:"Venta " + sale.method });
      }
      const client = state.clients.find(c => c.name === sale.client);
      if (client) client.purchases = [...new Set([...(client.purchases || []), ...saleItems.map(i => i.name)])];
      state.sales.unshift(sale);
      saleLines = [{ productId: state.products.find(p => p.active)?.id || state.products[0]?.id || "", quantity: 1 }];
      saveState();
      if (currentModal) closeModal();
      toast("Venta registrada");
      render();
    }
    function saleRow(sale) {
      return `<div class="list-row"><div><strong>${safe(sale.client)} · ${safe(sale.method)}</strong><span>${dateLabel(sale.dateISO)} · ${sale.items.map(i => `${i.quantity} x ${safe(i.name)}`).join(", ")}</span></div><b>${money(sale.total)}</b></div>`;
    }

    function reportsPage() {
      const filtered = reportSales();
      const reportStats = {
        total: filtered.reduce((sum, s) => sum + s.total, 0),
        profit: filtered.reduce((sum, s) => sum + saleProfit(s), 0),
        count: filtered.length,
        units: filtered.flatMap(s => s.items).reduce((sum, item) => sum + item.quantity, 0),
        avg: filtered.length ? filtered.reduce((sum, s) => sum + s.total, 0) / filtered.length : 0
      };
      return `<section class="card">
        <div class="card-head"><div><h2>Reportes de ventas</h2><p class="subtitle">Filtrá por día, semana, mes o todo el historial.</p></div><button class="btn gold" onclick="exportReportExcel()">${icons.report}Exportar Excel</button></div>
        <div class="report-controls">
          ${field("Periodo", `<select id="report-mode" onchange="reportMode=this.value;render()"><option value="dia" ${reportMode==="dia"?"selected":""}>Por día</option><option value="semana" ${reportMode==="semana"?"selected":""}>Por semana</option><option value="mes" ${reportMode==="mes"?"selected":""}>Por mes</option><option value="todo" ${reportMode==="todo"?"selected":""}>Todo</option></select>`)}
          ${field("Día", `<input id="report-date" type="date" value="${reportDate}" onchange="reportDate=this.value;render()">`)}
          ${field("Semana", `<input id="report-week" type="week" value="${reportWeek}" onchange="reportWeek=this.value;render()">`)}
          ${field("Mes", `<input id="report-month" type="month" value="${reportMonth}" onchange="reportMonth=this.value;render()">`)}
        </div>
      </section>
      <section class="grid-4">
        ${kpi("Ventas", money(reportStats.total), "Facturación del periodo", "sale")}
        ${kpi("Ganancia", money(reportStats.profit), "Estimado: venta menos costo", "report", true)}
        ${kpi("Operaciones", reportStats.count, "Ventas registradas", "order", true)}
        ${kpi("Unidades", reportStats.units, "Productos vendidos", "box")}
      </section>
      <section class="grid-2 equal">
        <div class="card"><div class="card-head"><h2>Productos más vendidos</h2></div>${productBars(filtered)}</div>
        <div class="card"><div class="card-head"><h2>Categorías con más ventas</h2></div>${categoryBars(filtered)}</div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Detalle de ventas</h2></div>
        ${filtered.length ? filtered.map(saleRow).join("") : `<div class="empty">No hay ventas para este periodo.</div>`}
      </section>`;
    }
    function updateReportInputs() {
      const date = document.getElementById("report-date");
      const week = document.getElementById("report-week");
      const month = document.getElementById("report-month");
      if (date) date.disabled = reportMode !== "dia";
      if (week) week.disabled = reportMode !== "semana";
      if (month) month.disabled = reportMode !== "mes";
    }
    function reportSales() {
      if (reportMode === "todo") return state.sales;
      if (reportMode === "dia") return state.sales.filter(s => s.dateISO === reportDate);
      if (reportMode === "semana") return state.sales.filter(s => isInWeek(s.dateISO, reportWeek));
      return state.sales.filter(s => s.dateISO.slice(0, 7) === reportMonth);
    }
    function itemCost(item) {
      return Number(state.products.find(p => p.id === item.productId)?.cost || 0);
    }
    function saleProfit(sale) {
      return sale.items.reduce((sum, item) => sum + (Number(item.price) - itemCost(item)) * Number(item.quantity), 0);
    }
    function exportReportExcel() {
      const rows = [["Fecha","Cliente","Método de pago","Producto","Cantidad","Precio unitario","Costo unitario","Total producto","Ganancia producto","Total venta","Ganancia venta"]];
      reportSales().forEach(sale => {
        sale.items.forEach(item => {
          const cost = itemCost(item);
          rows.push([
          sale.dateISO,
          sale.client,
          sale.method,
          item.name,
          item.quantity,
          item.price,
          cost,
          item.price * item.quantity,
          (item.price - cost) * item.quantity,
          sale.total,
          saleProfit(sale)
        ]);
        });
      });
      const csv = rows.map(row => row.map(cell => `"${String(cell).replaceAll('"','""')}"`).join(";")).join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "application/vnd.ms-excel;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `reporte-cagna-junin-${reportMode}.xls`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Reporte exportado");
    }
    function productBars(sales) {
      const totals = {};
      sales.flatMap(s => s.items).forEach(item => {
        totals[item.name] = (totals[item.name] || 0) + item.quantity;
      });
      return bars(totals, "un.");
    }
    function categoryBars(sales) {
      const totals = {};
      sales.flatMap(s => s.items).forEach(item => {
        const product = state.products.find(p => p.id === item.productId);
        const category = product?.category || "Sin categoría";
        totals[category] = (totals[category] || 0) + item.price * item.quantity;
      });
      return bars(totals, "$");
    }
    function bars(source, unit) {
      const entries = Object.entries(source).sort((a,b) => b[1] - a[1]).slice(0, 6);
      const max = Math.max(1, ...entries.map(item => item[1]));
      if (!entries.length) return `<div class="empty">Sin datos para mostrar.</div>`;
      return `<div class="bar-list">${entries.map(([label, value]) => `<div class="bar"><strong>${safe(label)}</strong><div class="bar-track"><div class="bar-fill" style="width:${Math.max(8, value / max * 100)}%"></div></div><span class="muted">${unit === "$" ? money(value) : value + " " + unit}</span></div>`).join("")}</div>`;
    }

    }
    function helpRow(row, index) {
      return `<div class="help-row"><div class="kpi-icon ${index % 2 ? "gold" : ""}">${icons.help}</div><div><h3>${safe(row[0])}</h3><p>${safe(row[1])}</p></div></div>`;
    }

    function settingsPage() {
      return `<section class="card">
        <h1 class="title">Configuración</h1>
        <p class="subtitle">Ajustes básicos del panel de Cagna Junín.</p>
      </section>
      <section class="grid-2 equal">
        <div class="card">
          <div class="card-head"><h2>Datos del negocio</h2></div>
          ${field("Nombre", `<input value="Cagna Junín" readonly>`)}
          <br>
          ${field("Rubro", `<input value="Mates, yerbas, termos y accesorios" readonly>`)}
          <br>
          ${field("Canal principal", `<input value="WhatsApp e Instagram" readonly>`)}
        </div>
        <div class="card">
          <div class="card-head"><h2>Limpieza rápida</h2></div>
          <p class="subtitle">Usá estas opciones para sacar datos de prueba sin tocar toda la app.</p>
          <br>
          <div class="stack-actions">
            <button class="btn danger" onclick="clearSales()">${icons.trash}Ventas en cero</button>
            <button class="btn secondary" onclick="clearOrders()">${icons.trash}Borrar pedidos</button>
            <button class="btn secondary" onclick="clearClients()">${icons.trash}Borrar clientes</button>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Empezar limpio</h2></div>
          <p class="subtitle">Deja la app vacía para cargar productos, stock, clientes, ventas y pedidos reales desde cero.</p>
          <br>
          <div class="stack-actions">
            <button class="btn danger" onclick="startBlankState()">${icons.trash}Dejar app vacía</button>
            <button class="btn secondary" onclick="resetState()">${icons.stock}Volver a datos de ejemplo</button>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Guardado en la nube</h2></div>
          <div class="cloud-box">
            <p class="subtitle">${cloudReady ? "Conectado a Supabase. Los cambios se guardan automáticamente y se comparten entre computadora y celular." : "Conectando con Supabase..."}</p>
            <div class="cloud-actions">
              <button class="btn" onclick="saveCloudStateNow()">${icons.check}Guardar ahora</button>
              <button class="btn secondary" onclick="pullCloudState().then(render)">${icons.stock}Traer de la nube</button>
              <button class="btn danger" onclick="appLogout()">${icons.trash}Cerrar acceso</button>
            </div>
          </div>
        </div>
      </section>`;
    }

    render();
    initCloud();
  </script>
</body>
</html>
